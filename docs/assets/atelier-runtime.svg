<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Atelier runtime architecture</title>
  <desc id="desc">Architecture diagram for Atelier agent runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
    <style>
      .title { fill: #e6edf3; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #8b949e; font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane { fill: rgba(255,255,255,0.035); stroke: #30363d; stroke-width: 1.2; }
      .box { fill: #161b22; stroke: #3d4654; stroke-width: 1.4; filter: url(#shadow); }
      .boxAccent { fill: #13233a; stroke: #58a6ff; stroke-width: 1.8; filter: url(#shadow); }
      .boxGreen { fill: #10281a; stroke: #3fb950; stroke-width: 1.5; filter: url(#shadow); }
      .h { fill: #e6edf3; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .p { fill: #b9c3cf; font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #8b949e; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .04em; }
      .arrow { stroke: #58a6ff; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text class="title" x="60" y="72">Atelier Agent Runtime</text>
  <text class="subtitle" x="60" y="106">A controllable foundation for design-oriented AI agents</text>

  <rect class="lane" x="50" y="145" width="1100" height="150" rx="16"/>
  <text class="small" x="76" y="178">ENTRY LAYER</text>
  <rect class="box" x="90" y="200" width="250" height="64" rx="10"/>
  <text class="h" x="116" y="228">Web Workspace</text>
  <text class="p" x="116" y="250">FastAPI + static UI</text>
  <rect class="box" x="475" y="200" width="250" height="64" rx="10"/>
  <text class="h" x="501" y="228">Interactive CLI</text>
  <text class="p" x="501" y="250">Local terminal sessions</text>
  <rect class="box" x="860" y="200" width="250" height="64" rx="10"/>
  <text class="h" x="886" y="228">REST / WebSocket</text>
  <text class="p" x="886" y="250">Integration interface</text>

  <rect class="lane" x="50" y="330" width="1100" height="180" rx="16"/>
  <text class="small" x="76" y="363">AGENT RUNTIME</text>
  <rect class="boxAccent" x="90" y="388" width="230" height="76" rx="12"/>
  <text class="h" x="116" y="417">Session Engine</text>
  <text class="p" x="116" y="440">state machine, checkpoints</text>
  <rect class="boxAccent" x="360" y="388" width="230" height="76" rx="12"/>
  <text class="h" x="386" y="417">Prompt Assembly</text>
  <text class="p" x="386" y="440">memory, plan, skills</text>
  <rect class="boxAccent" x="630" y="388" width="230" height="76" rx="12"/>
  <text class="h" x="656" y="417">Model Providers</text>
  <text class="p" x="656" y="440">OpenAI-compatible, Anthropic</text>
  <rect class="boxAccent" x="900" y="388" width="210" height="76" rx="12"/>
  <text class="h" x="926" y="417">Tool Executor</text>
  <text class="p" x="926" y="440">registry, approval, limits</text>

  <rect class="lane" x="50" y="545" width="1100" height="90" rx="16"/>
  <text class="small" x="76" y="578">PERSISTENCE AND EXTENSIONS</text>
  <rect class="boxGreen" x="90" y="595" width="205" height="48" rx="10"/>
  <text class="p" x="116" y="625">SQLite Sessions</text>
  <rect class="boxGreen" x="330" y="595" width="205" height="48" rx="10"/>
  <text class="p" x="356" y="625">Memory + Plans</text>
  <rect class="boxGreen" x="570" y="595" width="205" height="48" rx="10"/>
  <text class="p" x="596" y="625">Personas + Skills</text>
  <rect class="boxGreen" x="810" y="595" width="205" height="48" rx="10"/>
  <text class="p" x="836" y="625">MCP Bridge</text>

  <path class="arrow" d="M215 265 C215 312 205 340 205 385"/>
  <path class="arrow" d="M600 265 C600 314 475 335 475 385"/>
  <path class="arrow" d="M985 265 C985 314 1005 337 1005 385"/>
  <path class="arrow" d="M320 426 L356 426"/>
  <path class="arrow" d="M590 426 L626 426"/>
  <path class="arrow" d="M860 426 L896 426"/>
  <path class="arrow" d="M205 464 C205 515 192 550 192 592"/>
  <path class="arrow" d="M475 464 C475 515 432 550 432 592"/>
  <path class="arrow" d="M745 464 C745 515 672 550 672 592"/>
  <path class="arrow" d="M1005 464 C1005 515 912 550 912 592"/>
</svg>
