<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Atelier agent workflow</title>
  <desc id="desc">Workflow diagram showing how Atelier runs an agent task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111d2b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
    <style>
      .title { fill: #e6edf3; font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #8b949e; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.4; }
      .boxBlue { fill: #13233a; stroke: #58a6ff; stroke-width: 1.7; }
      .boxYellow { fill: #2a220b; stroke: #d29922; stroke-width: 1.5; }
      .boxGreen { fill: #10281a; stroke: #3fb950; stroke-width: 1.5; }
      .h { fill: #e6edf3; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .p { fill: #b9c3cf; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .n { fill: #58a6ff; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #58a6ff; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #8b949e; stroke-width: 1.8; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <text class="title" x="60" y="70">From request to visible execution</text>
  <text class="subtitle" x="60" y="102">Atelier keeps long-running agent work inspectable, interruptible, and resumable.</text>

  <rect class="boxBlue" x="70" y="180" width="150" height="98" rx="12"/>
  <text class="n" x="96" y="212">01</text>
  <text class="h" x="96" y="238">User Request</text>
  <text class="p" x="96" y="260">Web, CLI, or API</text>

  <rect class="boxBlue" x="275" y="180" width="170" height="98" rx="12"/>
  <text class="n" x="301" y="212">02</text>
  <text class="h" x="301" y="238">Build Context</text>
  <text class="p" x="301" y="260">persona, memory, plan</text>

  <rect class="boxBlue" x="500" y="180" width="170" height="98" rx="12"/>
  <text class="n" x="526" y="212">03</text>
  <text class="h" x="526" y="238">Model Round</text>
  <text class="p" x="526" y="260">reason or call tools</text>

  <rect class="boxYellow" x="725" y="180" width="180" height="98" rx="12"/>
  <text class="n" x="751" y="212">04</text>
  <text class="h" x="751" y="238">Approval Gate</text>
  <text class="p" x="751" y="260">ask, auto, or full</text>

  <rect class="boxYellow" x="960" y="180" width="170" height="98" rx="12"/>
  <text class="n" x="986" y="212">05</text>
  <text class="h" x="986" y="238">Execute Tool</text>
  <text class="p" x="986" y="260">files, shell, web, image</text>

  <rect class="boxGreen" x="300" y="360" width="190" height="82" rx="12"/>
  <text class="h" x="326" y="393">Persist State</text>
  <text class="p" x="326" y="416">messages, plan, memory</text>

  <rect class="boxGreen" x="550" y="360" width="190" height="82" rx="12"/>
  <text class="h" x="576" y="393">Stream Events</text>
  <text class="p" x="576" y="416">tokens, tools, results</text>

  <rect class="boxGreen" x="800" y="360" width="190" height="82" rx="12"/>
  <text class="h" x="826" y="393">Final Answer</text>
  <text class="p" x="826" y="416">or continue after tools</text>

  <path class="arrow" d="M220 229 L270 229"/>
  <path class="arrow" d="M445 229 L495 229"/>
  <path class="arrow" d="M670 229 L720 229"/>
  <path class="arrow" d="M905 229 L955 229"/>
  <path class="arrow" d="M1045 278 C1045 328 918 349 895 358"/>
  <path class="arrow" d="M800 401 L745 401"/>
  <path class="arrow" d="M550 401 L495 401"/>
  <path class="loop" d="M395 360 C395 320 585 318 585 280"/>
  <path class="loop" d="M645 360 C645 324 815 319 815 280"/>

  <text class="p" x="430" y="327">loop while more action is needed</text>
</svg>
