<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier Toolchain Test Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f7fa; color: #1f2937; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    figure { margin: 0; background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #e5e7eb; }
    figcaption { margin-top: 12px; font-size: 14px; color: #4b5563; }
  </style>
</head>
<body>
  <h1>Atelier Toolchain Test Gallery</h1>
  <div class="grid">
    <figure>
      <img src="generated-images/atelier-reference-icon.png" alt="Generated reference image for Atelier" />
      <figcaption>Generated reference image</figcaption>
    </figure>
    <figure>
      <img src="edits/atelier-edited-icon.png" alt="Edited Atelier app icon" />
      <figcaption>Edited app icon</figcaption>
    </figure>
  </div>
</body>
</html>
